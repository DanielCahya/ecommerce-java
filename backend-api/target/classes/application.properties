spring.application.name=ecommerce-api

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:8a4b6c9d2e1f3g5h7j8k9l0m1n2p4q5r6s7t8u9v0w1x2y3z4a5b6c7d8e9f0a1}
app.jwt.expirationMs=86400000

# Server Port
server.port=8080
